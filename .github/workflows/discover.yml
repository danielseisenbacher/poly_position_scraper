# Every 4 h: find and score candidate wallets, sync one GitHub issue per flagged
# wallet, commit the results to the `data` branch and the large state to the
# `state-latest` release.
name: discover

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Score and report only: no data commit, no issues, no state upload"
        type: boolean
        default: false
      seed_file:
        description: "Optional path (in this repo) to a file with one address per line to evaluate regardless of TTL"
        type: string
        default: ""

permissions:
  contents: read

# Shared with track.yml and maintenance.yml so only one job writes `data` at a time.
# Note: GitHub keeps at most one *pending* run per group; a newer queued run replaces
# it. A discover run that is pending behind a tracker run can therefore be replaced
# by the next tracker tick (rare; the next discover run catches up).
concurrency:
  group: data-writer
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RUST_LOG: info
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      SEED_FILE: ${{ inputs.seed_file }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            polywatch.toml
            scripts/ci/
            ${{ inputs.seed_file }}

      - name: Download binary
        run: scripts/ci/fetch-binary.sh

      - name: Check out data branch
        run: scripts/ci/clone-data.sh --create

      - name: Download state
        run: scripts/ci/state.sh fetch evaluated.bin:state/evaluated.bin proxy_owner.bin:state/proxy_owner.bin markets_cache.json.gz:state/markets_cache.json.gz

      - name: Discover
        run: |
          set -euo pipefail
          args=(discover --data-dir data --state-dir state --report discover.report.json)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$SEED_FILE" ]]; then
            if [[ ! -f "$SEED_FILE" ]]; then
              echo "::error::seed file '$SEED_FILE' not found in the repository"
              exit 1
            fi
            echo "Seeding $(grep -cE '0x[0-9a-fA-F]{40}' "$SEED_FILE" || true) addresses from $SEED_FILE"
            args+=(--seed-file "$SEED_FILE")
          fi
          bin/polywatch "${args[@]}"

      - name: Sync issues
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          bin/polywatch alert --data-dir data --state-dir state

      - name: Commit data
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          scripts/ci/push-data.sh "discover: $(jq -r '"\(.flagged_high) high, \(.flagged_medium) medium, watchlist \(.watchlist_size)"' discover.report.json) [run ${GITHUB_RUN_ID}]"

      # After the data push on purpose: if this fails, the next run merely re-evaluates.
      - name: Upload state
        if: env.DRY_RUN != 'true'
        run: scripts/ci/state.sh push evaluated.bin:state/evaluated.bin proxy_owner.bin:state/proxy_owner.bin markets_cache.json.gz:state/markets_cache.json.gz

      - name: Job summary
        if: always()
        run: scripts/ci/summary.sh discover discover.report.json "$DRY_RUN"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discover-report-${{ github.run_id }}
          path: discover.report.json
          retention-days: 14
          if-no-files-found: warn
